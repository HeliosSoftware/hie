[package]
name = "helios-hie"
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
description = "Helios Integration Engine (working name): feeds, transforms and monitored delivery into HFS"
publish = false

[lib]
name = "hie"
path = "src/lib.rs"

[[bin]]
name = "hie"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.4"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = "1.3.1"
futures = "0.3"
helios-auth = "0.2"
hex = "0.4.3"
http = "1"
object_store = { version = "0.11", features = ["aws"] }
postgres = "0.19"
rand = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
serde = { version = "1.0.224", features = ["derive"] }
serde_json = "1.0.144"
serde_yaml = "0.9"
sha2 = "0.10.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "any", "json", "chrono", "uuid", "rust_decimal"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonwebtoken = "9"
tempfile = "3"
