[package]
name = "helios-hie"
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
description = "Helios Integration Engine (working name): feeds, transforms and monitored delivery into HFS"
publish = false

[lib]
name = "hie"
path = "src/lib.rs"

[[bin]]
name = "hie"
path = "src/main.rs"

[features]
default = ["secrets-native"]
# Connector credentials encrypted in the engine's own store (SQLite or PostgreSQL).
secrets-native = ["dep:chacha20poly1305", "dep:hkdf", "dep:hmac", "dep:getrandom", "dep:base64"]
# secrets-aws: reserved for a backend on AWS Secrets Manager; not built yet.

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
axum = "0.8.4"
base64 = { version = "0.22", optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"], optional = true }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = "1.3.1"
futures = "0.3"
getrandom = { version = "0.4", optional = true }
helios-auth = "0.2"
hex = "0.4.3"
hkdf = { version = "0.13", optional = true }
# Only to wipe HMAC state: hkdf already depends on it.
hmac = { version = "0.13", default-features = false, features = ["zeroize"], optional = true }
http = "1"
object_store = { version = "0.11", features = ["aws"] }
percent-encoding = "2"
postgres = "0.19"
rand = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.224", features = ["derive"] }
serde_json = "1.0.144"
serde_yaml = "0.9"
sha2 = { version = "0.11", features = ["zeroize"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "any", "json", "chrono", "uuid", "rust_decimal"] }
tempfile = "3"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
zeroize = { version = "1.8", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonwebtoken = "9"
