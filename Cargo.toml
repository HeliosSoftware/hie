[package]
name = "helios-hie"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
description = "Helios Integration Engine (working name): feeds, transforms and monitored delivery into HFS"
publish = false

[lib]
name = "hie"
path = "src/lib.rs"

[[bin]]
name = "hie"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.4"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
csv = "1.3.1"
futures = "0.3"
helios-auth = "0.2"
hex = "0.4.3"
http = "1"
object_store = { version = "0.11", features = ["aws"] }
rand = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
serde = { version = "1.0.224", features = ["derive"] }
serde_json = "1.0.144"
serde_yaml = "0.9"
sha2 = "0.10.9"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
jsonwebtoken = "9"
tempfile = "3"
