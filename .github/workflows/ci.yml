name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transform tests
        run: python -m unittest tests/test_lab_results.py
      - name: Build
        run: dotnet build Hie.slnx -c Release -warnaserror
      - name: Engine tests
        run: dotnet test Hie.slnx -c Release --no-build --logger "console;verbosity=normal"
        env:
          HIE_TEST_PYTHON: python

  image:
    name: Container image (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hie:ci .
      - name: Smoke test
        run: |
          docker run --rm hie:ci check
          docker run --rm --entrypoint python3 hie:ci --version
