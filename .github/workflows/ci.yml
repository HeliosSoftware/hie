name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Transform tests
        run: python -m unittest tests/test_lab_results.py
      - name: Engine tests
        run: cargo test
        env:
          HIE_TEST_PYTHON: python

  image:
    name: Container image (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hie:ci .
      - name: Smoke test
        run: |
          docker run --rm hie:ci check
          docker run --rm --entrypoint python3 hie:ci --version
